{% extends "templates/web.html" %}

{% block page_content %}
<div class="container mt-5">
  <div class="card border-0">
    <div class="row no-gutters">
      {% if image %}
      <div class="col-md-5">
        <img src="{{ image }}" alt="{{ title }}" class="img-fluid rounded-left w-100 h-100" style="object-fit: cover;">
      </div>
      {% endif %}
      
      <div class="col-md-7">
        <div class="card-body">
          <h1 class="card-title mb-3">{{ title }}</h1>
          
          <p class="text-muted mb-2">By <strong>{{ author }}</strong></p>

          {% if status == 'Available' %}
            <span class="badge badge-success mb-3">Available</span>
          {% elif status == 'Issued' %}
            <span class="badge badge-danger mb-3">Issued</span>
          {% endif %}

          <p><strong>Publisher:</strong> {{ publisher }}</p>
          <p><strong>ISBN:</strong> {{ isbn }}</p>

          <hr>

          <div class="mt-4">
            {{ description }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
